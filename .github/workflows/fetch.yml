name: fetch-hot

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1,13 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [search]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run fetch (scheduled or manual)
        if: github.event_name != 'repository_dispatch'
        run: node fetch.js
      - name: Run search (on-demand)
        if: github.event_name == 'repository_dispatch'
        run: node fetch.js --search "${{ github.event.client_payload.q }}"
      - name: Commit data
        run: |
          git config user.name "hot-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "update hot data $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git push
